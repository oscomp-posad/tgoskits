# Build-time config template for StarryOS on Orange Pi 5 Plus.
target = "aarch64-unknown-none-softfloat"
# Runtime U-Boot settings live in `orangepi-5-plus-uboot.toml`.
features = [
  "ax-driver/list-pci-devices",
  "ax-driver/rk3588-pcie",
  "ax-driver/realtek-rtl8125",
  "ax-driver/rockchip-soc",
  "ax-driver/rockchip-dwc-xhci",
  "ax-driver/rockchip-ehci",
  "ax-driver/rockchip-sdhci",
  "ax-driver/rockchip-dwmmc",
  "rknpu",
  "rk3588-pwm",
  # NOTE: the native VOP2 display driver (`rockchip-vop2`) is intentionally NOT
  # enabled by default. Its probe reads VOP2 MMIO at boot, and this driver does
  # not power the VOP domain itself (Stage 1 assumes U-Boot did) — on a board
  # where U-Boot left the VOP unpowered an MMIO read can be a synchronous
  # external abort that hangs boot, which would break the other tests that share
  # this config. Add `"rockchip-vop2"` here for a watched display bring-up
  # session (see the Stage-1 plan: dump-first, confirm a live window). The driver
  # is fully built + host-tested regardless via `ax-driver/rockchip-vop2`.
]
log = "Info"
max_cpu_num = 8
