[package]
authors = [
  "Azure-stars <Azure_stars@126.com>",
  "Yuekai Jia <equation618@gmail.com>",
  "KylinSoft Co., Ltd. <https://www.kylinos.cn/>",
  "朝倉水希 <asakuramizu111@gmail.com>",
  "Mivik <mivikq@gmail.com>",
]
description = "A Linux-compatible OS kernel built on ArceOS unikernel"
edition.workspace = true
license.workspace = true
name = "starryos"
repository.workspace = true
version = "0.5.25"

[features]
default = []
qemu = [
  "ax-runtime/irq",
  "ax-runtime/rtc",
  "ax-runtime/display",
  "starry-kernel/input",
  "starry-kernel/vsock", # auxiliary features
]
smp = ["ax-runtime/smp", "axplat-dyn/smp", "ax-hal/smp", "starry-kernel/ipi"]

k230 = [
  "starry-kernel/k230-kpu",
  "ax-driver/k230-sdhci",
  "ax-driver/serial",
]

rknpu = ["ax-driver/rknpu", "starry-kernel/rknpu"]
# Native RK3588 VOP2 display driver. `ax-runtime/display` compiles in the
# display runtime path (ax-runtime `init_display`, devices.rs) exactly as the
# `qemu` feature does; without it the registered display device is never taken up.
rockchip-vop2 = [
  "ax-driver/rockchip-vop2",
  "starry-kernel/rockchip-vop2",
  "ax-runtime/display",
]
# Full HDMI cold-init (own PHY+TX+CRU+GRF, no U-Boot reuse). Opt-in for a watched
# display bring-up; board-validation pending. Implies the display runtime path.
rockchip-vop2-coldinit = [
  "ax-driver/rockchip-vop2-coldinit",
  "starry-kernel/rockchip-vop2-coldinit",
  "ax-runtime/display",
]
jpeg = ["ax-driver/jpeg", "starry-kernel/jpeg"]
rk3588-pwm = ["starry-kernel/rk3588-pwm"]
stack-protector = ["ax-std/stack-protector", "starry-kernel/stack-protector"]

[[bin]]
name = "starryos"
path = "src/main.rs"

[[bin]]
name = "xtask"
path = "xtask/main.rs"

[dependencies]
ax-std = { workspace = true, features = ["ext-ld", "fs", "multitask", "irq"] }
ax-driver.workspace = true
ax-hal.workspace = true
ax-runtime = { workspace = true, features = ["ext-ld", "irq"] }
axplat-dyn.workspace = true
starry-kernel = { workspace = true, features = ["dev-log", "ext4"] }

[target.'cfg(any(windows, all(unix, not(target_env = "musl"))))'.dependencies]
anyhow = "1.0"
axbuild = { workspace = true }
clap = { version = "4.6", features = ["derive"] }
tokio = { version = "1.0", features = ["full"] }

[package.metadata.vendor-filter]
all-features = true
platforms = ["riscv64gc-unknown-none-elf", "loongarch64-unknown-none-softfloat"]
