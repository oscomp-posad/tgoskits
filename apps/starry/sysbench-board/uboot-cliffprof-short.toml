# Profile the K=8 oversubscription cliff with wakeprof: reset counters, run 8
# concurrent ppong pairs (16 procs on 8 cores = 2:1), then dump /proc/wakeprof so
# the wake-to-run latency split (LOCAL / XCORE_IDLE / XCORE_BUSY) shows whether the
# ~174us/roundtrip cliff is scheduling delay (woken task waiting for a busy core).
serial = "/dev/cu.usbserial-AQ03MLX2"
baud_rate = "1500000"
dtb_file = "os/StarryOS/configs/board/orangepi-5-plus.dtb"
shell_prefix = "root@starry:/root #"
shell_init_cmd = "cat /proc/wakeprof_reset; echo CLIFF_BEGIN; k=0; while [ $k -lt 8 ]; do /home/orangepi/ppong -P 30000 & k=$((k+1)); done; wait; echo WAKEPROF_DUMP:; cat /proc/wakeprof; echo FULL_RUN_DONE; sleep 2; sync; reboot -f"
success_regex = ["(?m)^FULL_RUN_DONE\\s*$"]
fail_regex = ["panicked at", "(?i)error while loading"]
timeout = 300
