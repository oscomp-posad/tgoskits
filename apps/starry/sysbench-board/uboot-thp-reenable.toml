# Ground-truth probe: mprotect(PROT_NONE)-after-touch re-enable + partial ops on
# a THP block. Driven by scripts/board/sdboot-run.py. FAIL lines are DATA (not a
# teardown trigger) — only a kernel panic/exception fails the run.
[net]
serial = "/dev/cu.usbserial-AQ03MLX2"
baud_rate = "1500000"
dtb_file = "os/StarryOS/configs/board/orangepi-5-plus.dtb"
shell_prefix = "root@starry:/root #"
shell_init_cmd = "echo REENABLE_BEGIN; /home/orangepi/thp_reenable; echo FULL_RUN_DONE; sleep 1; sync; reboot -f"
success_regex = ["(?m)^FULL_RUN_DONE\\s*$"]
fail_regex = ["panicked at", "Unhandled( Synchronous)? [Ee]xception", "Kernel panic", "Synchronous Abort"]
timeout = 180
