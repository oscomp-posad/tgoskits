# TFTP/Ethernet variant of uboot-matrix (replaces the slow, corruption-prone
# 1.5 Mbps serial ymodem upload). With [net] set, ostool runs its built-in Rust
# TFTP server on the Mac's `interface` IP (en5 = 169.254.99.39), sets U-Boot
# ipaddr=board_ip + serverip=en5-IP, and boots via `tftp <fit> && bootm`.
# If the board's U-Boot has no working Ethernet device (net list empty), ostool
# auto-falls-back to loady (serial) — so this is strictly safe to try.
# NOTE: all top-level scalar keys MUST precede the [net] table (TOML scoping).
serial = "/dev/cu.usbserial-AQ03MLX2"
baud_rate = "1500000"
dtb_file = "os/StarryOS/configs/board/orangepi-5-plus.dtb"
shell_prefix = "root@starry:/root #"
shell_init_cmd = "test -x /home/orangepi/full-matrix.sh || { echo MATRIX_MISSING; exit 1; }; sh /home/orangepi/full-matrix.sh 2>&1 | tee /home/orangepi/matrix-results.txt; chmod 666 /home/orangepi/matrix-results.txt; sync; sync; echo FULL_RUN_DONE; sleep 3; sync; reboot"
success_regex = ["(?m)^FULL_RUN_DONE\\s*$"]
fail_regex = [
  "panicked at",
  '(?m)^MATRIX_MISSING\s*$',
  "(?i)error while loading shared libraries",
]
timeout = 1800

[net]
interface = "en5"
board_ip = "169.254.50.2"
netmask = "255.255.0.0"
