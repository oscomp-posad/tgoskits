# ABLATION Table-1 cumulative ladder rung. Holds mm/syscall levers at SHIP level
# (thp + user-access-fastpath + tickacct ON) + frequency-held; ONLY the scheduler
# feature stack varies across rungs, so each rung isolates one sched lever's
# contribution to sysbench-cpu scaling. See ABLATION.md Table 1.
# Rung +L1L3: + occupancy-aware capacity placement (sched-loadbalance).
target = "aarch64-unknown-none-softfloat"
features = [
  "ax-driver/rockchip-soc",
  "ax-driver/rockchip-sdhci",
  "ax-driver/rockchip-dwmmc",
  "ax-driver/rk3588-cpufreq",
  "ax-driver/rk3588-ddr-dvfs",
  "starry-kernel/thp",
  "starry-kernel/user-access-fastpath",
  "starry-kernel/tickacct",
  "starry-kernel/sched-loadbalance",
]
log = "Info"
max_cpu_num = 8
