# Cliff A/B candidate A: ship placement config + idle-poll (spin ~50us before WFI
# so cross-core wakes onto a transiently-WFI core skip the ~1ms GIC-SGI floor).
# Tests whether cheap cross-core wakes collapse the K=8 oversubscription cliff.
target = "aarch64-unknown-none-softfloat"
features = [
  "ax-driver/rockchip-soc",
  "ax-driver/rockchip-sdhci",
  "ax-driver/rockchip-dwmmc",
  "ax-driver/rk3588-cpufreq",
  "ax-driver/rk3588-ddr-dvfs",
  "starry-kernel/thp",
  "starry-kernel/sched-loadbalance",
  "starry-kernel/sched-loadbalance-wake-affine",
  "starry-kernel/user-access-fastpath",
  "starry-kernel/idle-poll",
]
log = "Info"
max_cpu_num = 8
