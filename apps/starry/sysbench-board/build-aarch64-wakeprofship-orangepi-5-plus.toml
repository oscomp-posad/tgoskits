# Ship placement config + wakeprof (to profile the K=8 oversubscription cliff under
# the ACTUAL shipped behavior: thp + LB + wake_affine + user-access-fastpath). No
# idle-poll (cores are busy under oversubscription; the ship config omits it).
target = "aarch64-unknown-none-softfloat"
features = [
  "ax-driver/rockchip-soc",
  "ax-driver/rockchip-sdhci",
  "ax-driver/rockchip-dwmmc",
  "ax-driver/rk3588-cpufreq",
  "ax-driver/rk3588-ddr-dvfs",
  "starry-kernel/thp",
  "starry-kernel/sched-loadbalance",
  "starry-kernel/sched-loadbalance-wake-affine",
  "starry-kernel/user-access-fastpath",
  "starry-kernel/wakeprof",
]
log = "Info"
max_cpu_num = 8
