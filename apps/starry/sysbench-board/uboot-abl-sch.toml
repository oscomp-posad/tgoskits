# ABLATION uboot driver: boot StarryOS, run abl-bench.sh sch, gate on ABLDONE.
# Numbers are read back from /home/orangepi/abl/out/sch.txt over ssh after reboot.
serial = "/dev/cu.usbserial-AQ03MLX2"
baud_rate = "1500000"
dtb_file = "os/StarryOS/configs/board/orangepi-5-plus.dtb"
shell_prefix = "root@starry:/root #"
shell_init_cmd = "/home/orangepi/abl/abl-bench.sh sch"
success_regex = ["ABLDONE"]
fail_regex = ["panicked at", "Kernel panic", "Unhandled", "Data abort"]
timeout = 360
