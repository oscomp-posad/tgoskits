# Runtime U-Boot config for booting the tennis StarryOS kernel on the Orange Pi
# 5 Plus over this mac's USB-serial adapter (TFTP from the host on reboot).
serial = "/dev/cu.usbserial-AQ03MLX2"
baud_rate = "1500000"
dtb_file = "os/StarryOS/configs/board/orangepi-5-plus.dtb"

success_regex = []
fail_regex = [
  "panicked at",
]
